name: Keep Streamlit Alive

on:
  schedule:
    # Roda a cada 20 minutos (Streamlit dorme após ~30 min sem acesso)
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dashboard
        run: |
          curl -sS --max-time 30 \
            -A "Mozilla/5.0 (keep-alive bot)" \
            "${{ secrets.STREAMLIT_URL }}" \
            -o /dev/null -w "Status: %{http_code}\n"
